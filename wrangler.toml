name = "anone"
compatibility_date = "2026-09-16"
workers_dev = true

routes = [
  { pattern = "anone.yoiailabs.com", custom_domain = true }
]

[observability]
enabled = true

# Vite の dist を Workers 静的アセットとして配信する。
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
