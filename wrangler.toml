name = "anone"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true
# 非本番ブランチの `wrangler versions upload` でブランチ別 Preview URL
# （<branch>-anone.<sub>.workers.dev）を作る。
preview_urls = true

routes = [
  { pattern = "anone.yoiailabs.com", custom_domain = true }
]

[observability]
enabled = true

# Vite / Astro の dist を Workers 静的アセットとして配信する。
# プレフィックスなしの `/` `/community` `/privacy` `/terms` だけ Worker が先に受け、
# Cookie があるときだけ /en /ko /zh へ寄せる。Accept-Language では寄せない
# （クローラが日本語の title / OGP を掴むため。ブラウザはクライアント JS で寄せる）。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = [
  "/",
  "/community",
  "/community/",
  "/ja",
  "/ja/",
  "/ja/community",
  "/ja/community/",
  "/privacy",
  "/privacy/",
  "/ja/privacy",
  "/ja/privacy/",
  "/terms",
  "/terms/",
  "/ja/terms",
  "/ja/terms/",
]
