name = "anone"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true
# 非本番ブランチの `wrangler versions upload` でブランチ別 Preview URL
# （<branch>-anone.<sub>.workers.dev）を作る。
preview_urls = true

routes = [
  { pattern = "anone.yoiailabs.com", custom_domain = true }
]

[observability]
enabled = true

# Vite / Astro の dist を Workers 静的アセットとして配信する。
# プレフィックスなしの `/` `/make` `/privacy` `/terms` と旧 community URL、
# 規約・ポリシーの言語付き URL だけ Worker が先に受ける。
# Cookie があるとき `/` と `/make` を /en /ko /zh へ寄せる。
# `/privacy` `/terms` は日本語のまま。言語付き URL は日本語へ 302 する。
# Accept-Language では寄せない
# （クローラが日本語の title / OGP を掴むため。ブラウザはクライアント JS で寄せる）。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = [
  "/",
  "/make",
  "/make/",
  "/ja/make",
  "/ja/make/",
  "/en/community",
  "/en/community/",
  "/ko/community",
  "/ko/community/",
  "/zh/community",
  "/zh/community/",
  "/community",
  "/community/",
  "/ja",
  "/ja/",
  "/ja/community",
  "/ja/community/",
  "/privacy",
  "/privacy/",
  "/ja/privacy",
  "/ja/privacy/",
  "/terms",
  "/terms/",
  "/ja/terms",
  "/ja/terms/",
  "/en/privacy",
  "/en/privacy/",
  "/ko/privacy",
  "/ko/privacy/",
  "/zh/privacy",
  "/zh/privacy/",
  "/en/terms",
  "/en/terms/",
  "/ko/terms",
  "/ko/terms/",
  "/zh/terms",
  "/zh/terms/",
]
