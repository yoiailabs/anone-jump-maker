name = "anone"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true
# 非本番ブランチの `wrangler versions upload` でブランチ別 Preview URL
# （<branch>-anone.<sub>.workers.dev）を作る。
preview_urls = true

routes = [
  { pattern = "anone.yoiailabs.com", custom_domain = true }
]

[observability]
enabled = true

# Vite / Astro の dist を Workers 静的アセットとして配信する。
# プレフィックスなしの `/` `/community` だけ Worker が先に受け、
# Cookie / Accept-Language で /en /ko /zh へ寄せる。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = [
  "/",
  "/community",
  "/community/",
  "/ja",
  "/ja/",
  "/ja/community",
  "/ja/community/",
]
