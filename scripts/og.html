<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>OGP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f6efe2;
        --ink: #1a1a1a;
        --teal: #44c0c4;
        --lime: #d4f06a;
        --coral: #ff7d74;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Zen Maru Gothic", "Noto Sans KR", "Noto Sans SC",
          "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      }

      body {
        position: relative;
      }

      .sky {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .blob {
        position: absolute;
        border-radius: 999px;
        opacity: 0.6;
        filter: blur(8px);
      }

      .blob-lime {
        width: 460px;
        height: 460px;
        background: color-mix(in srgb, var(--lime) 55%, white);
        top: -170px;
        left: -150px;
      }

      .blob-teal {
        width: 380px;
        height: 380px;
        background: color-mix(in srgb, var(--teal) 45%, white);
        top: 80px;
        right: -160px;
      }

      .blob-coral {
        width: 400px;
        height: 400px;
        background: color-mix(in srgb, var(--coral) 45%, white);
        bottom: -180px;
        right: -130px;
      }

      .hero {
        position: relative;
        z-index: 1;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px;
      }

      .eyebrow {
        font-size: 24px;
        letter-spacing: 0.16em;
        margin-bottom: 8px;
      }

      h1 {
        display: flex;
        justify-content: center;
        max-width: 1040px;
      }

      .hero-logo {
        display: block;
        width: 800px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 640 / 365;
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="blob blob-lime"></span>
      <span class="blob blob-teal"></span>
      <span class="blob blob-coral"></span>
    </div>
    <div class="hero">
      <p class="eyebrow">#あのねジャンプ</p>
      <h1 id="ogTitle">
        <img
          class="hero-logo"
          src="/brand/anone-logo-stacked.svg"
          width="640"
          height="365"
          alt="あのねジャンプメーカー"
        />
      </h1>
    </div>
    <script>
      const titles = {
        ja: "あのねジャンプメーカー",
        en: "Anone Jump Maker",
        ko: "아노네 점프 메이커",
        zh: "あのね跳跃制作器",
      };
      const locale = new URLSearchParams(location.search).get("locale");
      const title = locale && titles[locale] ? titles[locale] : titles.ja;
      const lang = locale && titles[locale] ? locale : "ja";
      document.documentElement.lang = lang;
      const logo = document.querySelector(".hero-logo");
      if (logo instanceof HTMLImageElement) logo.alt = title;
    </script>
  </body>
</html>
